syntax = "proto3";
package legible.knowledge.v1;

option go_package = "github.com/legible-money/legible/x/knowledge/types";

import "cosmos/msg/v1/msg.proto";
import "legible/knowledge/v1/stratum.proto";
import "legible/knowledge/v1/domain.proto";

// Msg defines the knowledge module's transaction service
service Msg {
  option (cosmos.msg.v1.service) = true;

  // ProposeDomain submits a proposal to add a new domain
  rpc ProposeDomain(MsgProposeDomain) returns (MsgProposeDomainResponse);

  // EndorseDomainProposal endorses a pending domain proposal
  rpc EndorseDomainProposal(MsgEndorseDomainProposal) returns (MsgEndorseDomainProposalResponse);

  // ChallengeDomainProposal challenges a pending domain proposal
  rpc ChallengeDomainProposal(MsgChallengeDomainProposal) returns (MsgChallengeDomainProposalResponse);

  // RegisterStratum registers a new stratum (governance-controlled)
  rpc RegisterStratum(MsgRegisterStratum) returns (MsgRegisterStratumResponse);

  // UpdateParams updates module parameters (governance-controlled)
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// ============================================================================
// Domain Proposal Messages
// ============================================================================

// MsgProposeDomain proposes a new domain to be added to the ontology
message MsgProposeDomain {
  option (cosmos.msg.v1.signer) = "proposer";

  // Address of the proposer
  string proposer = 1;

  // The proposed domain
  DomainRegistrationInput domain = 2;

  // Stake to lock (must meet minimum requirement)
  string stake = 3;
}

message MsgProposeDomainResponse {
  // The created proposal ID
  string proposal_id = 1;

  // Whether governance approval is required
  bool requires_governance = 2;

  // When voting ends (if requires_governance)
  uint64 voting_ends_at = 3;
}

// MsgEndorseDomainProposal endorses a pending domain proposal
message MsgEndorseDomainProposal {
  option (cosmos.msg.v1.signer) = "endorser";

  // Address of the endorser
  string endorser = 1;

  // Proposal ID to endorse
  string proposal_id = 2;

  // Stake to lock as endorsement
  string stake = 3;
}

message MsgEndorseDomainProposalResponse {
  // Total endorsement stake after this endorsement
  string total_endorsement_stake = 1;
}

// MsgChallengeDomainProposal challenges a pending domain proposal
message MsgChallengeDomainProposal {
  option (cosmos.msg.v1.signer) = "challenger";

  // Address of the challenger
  string challenger = 1;

  // Proposal ID to challenge
  string proposal_id = 2;

  // Stake to lock as challenge
  string stake = 3;

  // Reason for challenging
  string reason = 4;
}

message MsgChallengeDomainProposalResponse {
  // Total challenge stake after this challenge
  string total_challenge_stake = 1;
}

// ============================================================================
// Stratum Registration Messages
// ============================================================================

// MsgRegisterStratum registers a new stratum (governance-controlled)
message MsgRegisterStratum {
  option (cosmos.msg.v1.signer) = "authority";

  // Module authority (typically governance module)
  string authority = 1;

  // The stratum definition to register
  StratumDefinition stratum = 2;

  // Governance proposal ID that authorized this
  string governance_proposal = 3;
}

message MsgRegisterStratumResponse {
  // Success indicator
  bool success = 1;
}

// ============================================================================
// Parameter Update Messages
// ============================================================================

// MsgUpdateParams updates module parameters (governance-controlled)
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  // Module authority (typically governance module)
  string authority = 1;

  // Updated parameters
  Params params = 2;
}

message MsgUpdateParamsResponse {}
