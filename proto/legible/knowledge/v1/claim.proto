syntax = "proto3";
package legible.knowledge.v1;

import "cosmos/msg/v1/msg.proto";

option go_package = "github.com/legible-money/legible/x/knowledge/types";

// ============================================================================
// Claim Lifecycle Types
// ============================================================================

// ClaimEvidence is supporting evidence for a knowledge claim.
message ClaimEvidence {
  string evidence_type = 1;
  string uri = 2;
  string content_hash = 3;
  map<string, string> metadata = 4;
}

// Claim represents a knowledge claim submitted for verification.
// Field names and types match Go types in x/knowledge/types/types.go.
message Claim {
  string id = 1;
  string claim_text = 2;
  string content_hash = 3;
  string domain = 4;
  string epistemic_category = 5;      // string, not enum — Go uses plain strings
  string submitter = 6;               // bech32 address
  string submitter_did = 7;
  string stake_amount = 8;            // bigint as string
  string status = 9;                  // pending, in_verification, accepted, rejected, challenged, expired
  uint64 submitted_at_height = 10;
  repeated string references = 11;    // fact IDs
  string logic_zone = 12;             // string, not enum — Go uses plain strings
  string round_id = 13;
  repeated ClaimEvidence evidence = 14;
  // Adversarial verification fields
  uint64 structural_score = 15;       // evaluation pipeline score (0-1,000,000)
  uint64 challenge_window_start = 16; // block when challenge window opens
  uint64 challenge_window_end = 17;   // block when challenge window closes
  string provisional_fact_id = 18;    // fact created during provisional acceptance
  uint32 active_challenge_count = 19; // concurrent challenges against this claim
  string reverification_fact_id = 20; // fact ID when claim is a reverification
}

enum ClaimStatus {
  CLAIM_STATUS_UNSPECIFIED = 0;
  CLAIM_STATUS_PENDING = 1;
  CLAIM_STATUS_IN_VERIFICATION = 2;
  CLAIM_STATUS_ACCEPTED = 3;
  CLAIM_STATUS_REJECTED = 4;
  CLAIM_STATUS_CHALLENGED = 5;
  CLAIM_STATUS_CONTESTED = 6;
  CLAIM_STATUS_INSUFFICIENT = 7;
  CLAIM_STATUS_EXPIRED = 8;
}

// ============================================================================
// Fact Types
// ============================================================================

// Fact represents verified knowledge stored on-chain.
// Field names and types match Go types in x/knowledge/types/types.go.
message Fact {
  string id = 1;
  string claim_text = 2;
  string domain = 3;
  string epistemic_category = 4;         // string, not enum
  uint64 confidence = 5;                 // 0-1000000 (6 decimal precision)
  string status = 6;                     // verified, contested, falsified, expired
  string submitter = 7;                  // bech32 address
  string submitter_did = 8;
  repeated string references = 9;        // fact IDs
  uint64 verified_at_height = 10;
  uint32 verifier_count = 11;
  string logic_zone = 12;               // string, not enum
  uint64 created_at_height = 13;
  uint64 last_verified_height = 14;
  // Decay tracking (lazy evaluation)
  uint64 last_confidence_update = 15;    // block of last decay calculation
  uint64 base_confidence = 16;           // confidence before decay applied
  // Extended fields for adversarial verification and knowledge graph
  uint64 expires_at_block = 17;          // block height when fact expires (0 = never)
  uint64 citation_count = 18;            // number of times cited by other facts
  uint64 last_cited_block = 19;          // block height of last citation
  uint64 total_citation_rewards = 20;    // total citation rewards received (ulgm)
  string superseded_by = 21;             // fact ID that supersedes this fact
  uint64 superseded_at_height = 22;      // block when superseded
  string original_stake = 23;            // original claim stake (bigint as string)
  string maturity = 24;                  // emerging, established, canonical
  uint64 stratum_ceiling = 25;           // max confidence from stratum
  uint64 challenge_count = 26;           // total challenges received
  repeated FactEvidenceSummary evidence_summaries = 27; // evidence snapshots from verification
  uint64 evidence_bonus = 28;            // additive evidence bonus (basis points)
  bool is_provisional = 29;             // true during challenge window
  uint64 challenge_window_end = 30;      // block when challenge window closes
  string original_claim_id = 31;         // claim that created this fact
  uint32 survived_challenges = 32;       // number of challenges survived
}

// FactEvidenceSummary is a snapshot of evidence that supported a fact at verification time.
message FactEvidenceSummary {
  string evidence_id = 1;
  string evidence_type = 2;
  uint64 reliability = 3;               // basis points at time of verification
  uint64 type_strength = 4;             // intrinsic type strength (basis points)
}

enum FactStatus {
  FACT_STATUS_UNSPECIFIED = 0;
  FACT_STATUS_VERIFIED = 1;
  FACT_STATUS_CONTESTED = 2;
  FACT_STATUS_FALSIFIED = 3;
  FACT_STATUS_EXPIRED = 4;
}

// FactReference links facts together in a knowledge graph.
// Field names match Go types (Weight, not Strength).
message FactReference {
  string from_fact_id = 1;
  string to_fact_id = 2;
  string reference_type = 3;            // supports, contradicts, extends, qualifies
  uint64 weight = 4;
  uint64 created_at_height = 5;
}

// ============================================================================
// Verification Round Types
// ============================================================================

// VerificationRound tracks a multi-block commit-reveal verification cycle.
// Go uses maps for commitments/reveals (validator -> value).
// State is stored as JSON, so map types work correctly.
message VerificationRound {
  string id = 1;
  string claim_id = 2;
  string phase = 3;                     // commit, reveal, aggregation, complete
  uint64 start_height = 4;
  uint64 commit_deadline_height = 5;
  uint64 reveal_deadline_height = 6;
  repeated string selected_validators = 7;
  // Map: validator address -> commitment/reveal
  map<string, VerificationCommitment> commitments = 8;
  map<string, VerificationReveal> reveals = 9;
  string final_verdict = 10;            // accepted, rejected, inconclusive
  uint64 final_confidence = 11;
  uint64 completed_at_height = 12;
  string type = 13;                     // verification, challenge, reverification, contradiction
}

enum VerificationPhase {
  VERIFICATION_PHASE_UNSPECIFIED = 0;
  VERIFICATION_PHASE_COMMIT = 1;
  VERIFICATION_PHASE_REVEAL = 2;
  VERIFICATION_PHASE_AGGREGATION = 3;
  VERIFICATION_PHASE_COMPLETE = 4;
  VERIFICATION_PHASE_EXPIRED = 5;
}

// VerificationCommitment is a validator's commitment hash (commit phase).
message VerificationCommitment {
  string validator = 1;
  string commitment_hash = 2;
  string vrf_output = 3;                // hex-encoded VRF output
  string vrf_proof = 4;                 // hex-encoded VRF proof (96 bytes)
  uint64 submitted_at_height = 5;
}

// VerificationReveal is a validator's revealed verdict (reveal phase).
message VerificationReveal {
  string validator = 1;
  string verdict = 2;                   // accept, reject, abstain
  uint64 confidence = 3;                // 0-1000000
  string justification = 4;
  string vrf_proof = 5;
  string salt = 6;                      // salt used in commitment hash
  uint64 submitted_at_height = 7;
  string verification_method = 8;       // method used for verification (AH-4 diversity check)
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ACCEPT = 1;
  VERDICT_REJECT = 2;
  VERDICT_ABSTAIN = 3;
}

// VerificationResult is the aggregated outcome of a verification round.
message VerificationResult {
  string verdict = 1;                   // accepted, rejected, contested, insufficient
  uint64 confidence = 2;                // 0-1000000 (6 decimal precision)
  uint64 agreement_ratio = 3;           // 0-1000000
  uint64 total_weight = 4;              // total stake weight of participants
  map<string, uint64> rewards = 5;      // validator → reward amount
  map<string, uint64> slashes = 6;      // validator → slash amount
  uint32 participant_count = 7;
  uint64 completed_at_height = 8;
  bool quorum_reached = 9;
  uint64 evidence_bonus = 10;           // additive evidence bonus (basis points)
  string domain = 11;                   // domain for reputation weighting
  int64 method_diversity_penalty = 12;  // AH-4: penalty/bonus for method diversity
  uint32 unique_method_count = 13;      // AH-4: count of distinct verification methods
}

// ============================================================================
// Validator Info
// ============================================================================

// ValidatorInfo represents a validator eligible for verification rounds.
message ValidatorInfo {
  string address = 1;                   // bech32 operator address
  uint64 stake = 2;                     // effective stake in ulgm
  uint32 tier = 3;                      // validator tier (0-3)
  bytes public_key = 4;                 // Ed25519 public key bytes
  uint64 reputation = 5;               // 0-1000000
}

// ============================================================================
// Knowledge Claim Tx Messages
// ============================================================================

// MsgSubmitClaim submits a knowledge claim for verification.
message MsgSubmitClaim {
  option (cosmos.msg.v1.signer) = "submitter";
  string claim_text = 1;
  string domain = 2;
  string epistemic_category = 3;
  string submitter = 4;                 // bech32 address
  string submitter_did = 5;
  string stake_amount = 6;              // bigint as string
  repeated string references = 7;       // fact IDs
  string logic_zone = 8;
  repeated ClaimEvidence evidence = 9;
}

message MsgSubmitClaimResponse {
  string claim_id = 1;
  string round_id = 2;
}

// MsgSubmitCommitment submits a verification commitment (commit phase).
message MsgSubmitCommitment {
  option (cosmos.msg.v1.signer) = "validator";
  string round_id = 1;
  string validator = 2;                 // bech32 address
  string commitment_hash = 3;
}

message MsgSubmitCommitmentResponse {}

// MsgSubmitReveal submits a verification reveal (reveal phase).
message MsgSubmitReveal {
  option (cosmos.msg.v1.signer) = "validator";
  string round_id = 1;
  string validator = 2;                 // bech32 address
  string verdict = 3;                   // accept, reject, abstain
  uint64 confidence = 4;
  string justification = 5;
  string vrf_proof = 6;
  string salt = 7;                      // for commitment verification
}

message MsgSubmitRevealResponse {}

// MsgChallengeFact challenges an existing verified fact.
message MsgChallengeFact {
  option (cosmos.msg.v1.signer) = "challenger";
  string fact_id = 1;
  string challenger = 2;                // bech32 address
  string reason = 3;
  string stake = 4;                     // bigint as string
}

message MsgChallengeFactResponse {
  string round_id = 1;
}

// MsgAddFact is a governance-gated fact creation (for genesis/migration).
message MsgAddFact {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;                 // bech32 address (gov module)
  string claim_text = 2;
  string domain = 3;
  string epistemic_category = 4;
  uint64 confidence = 5;
  repeated string references = 6;
  string logic_zone = 7;
}

message MsgAddFactResponse {
  string fact_id = 1;
}

// ============================================================================
// Domain Management Messages
// ============================================================================

// MsgProposeDomain proposes a new ontological domain.
message MsgProposeDomain {
  option (cosmos.msg.v1.signer) = "proposer";
  string name = 1;
  string description = 2;
  string proposer = 3;                  // bech32 address
  string stake = 4;                     // bigint as string
}

message MsgProposeDomainResponse {
  string domain_name = 1;
}

// MsgEndorseDomainProposal endorses a domain proposal.
message MsgEndorseDomainProposal {
  option (cosmos.msg.v1.signer) = "endorser";
  string domain_name = 1;
  string endorser = 2;                  // bech32 address
}

message MsgEndorseDomainProposalResponse {}

// MsgChallengeDomainProposal challenges a domain proposal.
message MsgChallengeDomainProposal {
  option (cosmos.msg.v1.signer) = "challenger";
  string domain_name = 1;
  string challenger = 2;                // bech32 address
  string reason = 3;
}

message MsgChallengeDomainProposalResponse {}

// MsgRegisterStratum registers an ontological stratum (Phase 2 feature).
message MsgRegisterStratum {
  option (cosmos.msg.v1.signer) = "registrar";
  string stratum_name = 1;
  string description = 2;
  string registrar = 3;                 // bech32 address
}

message MsgRegisterStratumResponse {}

// MsgUpdateParams updates module parameters.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;                 // bech32 address (gov module)
  Params params = 2;
}

message MsgUpdateParamsResponse {}

// ============================================================================
// Module Parameters
// ============================================================================

// Params defines the knowledge module parameters.
message Params {
  uint64 ontology_version = 1;
  uint64 cross_stratum_discount = 2;
  string min_domain_proposal_stake = 3;
  uint64 domain_voting_period = 4;
  uint32 min_endorsements = 5;
  bool allow_partial_coverage = 6;
  uint64 partial_coverage_penalty = 7;
  uint64 lower_stratum_veto_weight = 8;
  uint64 cross_stratum_agreement_threshold = 9;
  uint32 min_claim_text_length = 10;
  uint64 max_claim_reward_multiplier = 11;
  uint64 commit_phase_duration = 12;
  uint64 reveal_phase_duration = 13;
  uint64 aggregation_phase_duration = 14;
  uint32 min_verifiers = 15;
  uint64 acceptance_threshold = 16;
  uint64 quorum_threshold = 17;
  uint32 max_validators_per_round = 18;
  // Slash rates (basis points / 1,000,000)
  uint64 invalid_claim_slash_bps = 19;          // slash on rejected claims (default 220000 = 22%)
  uint64 wrong_verification_slash_bps = 20;     // slash on wrong verification (default 60000 = 6%)
  uint64 missed_reveal_slash_bps = 21;          // slash on missed reveal (default 100 = 0.01%)
  uint64 verification_reward_amount = 22;       // base reward per correct verification (ulgm)
  uint64 research_tax_rate = 23;                // research fund tax rate (default 220000 = 22%)
  uint64 equivocation_slash_bps = 24;           // slash for equivocation (100% = 1000000)
  // Adversarial verification parameters
  uint64 provisional_threshold = 25;            // min score to create provisional fact (default 500000)
  uint64 base_challenge_duration = 26;          // base challenge window in blocks
  string min_challenge_stake = 27;              // min stake for challenge (bigint as string)
  bool challenge_evidence_required = 28;        // whether evidence is required for challenges
  uint64 confidence_growth_per_epoch = 29;      // confidence growth per epoch (basis points)
  uint64 max_survival_confidence = 30;          // max confidence for unchallenged facts (basis points)
  uint64 failed_challenge_slash_bps = 31;       // slash on failed challenge (basis points)
  uint64 successful_challenge_reward_bps = 32;  // reward from slashed stake (basis points)
  bool adversarial_verification_enabled = 33;   // enable adversarial verification mode
}

// ============================================================================
// Domain Types
// ============================================================================

// OntologicalDomain represents a knowledge domain.
message OntologicalDomain {
  string name = 1;
  string description = 2;
  string proposer = 3;                  // bech32 address
  string status = 4;                    // proposed, active, deprecated
  uint32 endorsements = 5;
  uint32 challenges = 6;
  uint64 created_at_height = 7;
}

