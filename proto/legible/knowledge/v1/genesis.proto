syntax = "proto3";
package legible.knowledge.v1;

option go_package = "github.com/legible-money/legible/x/knowledge/types";

import "legible/knowledge/v1/claim.proto";
import "legible/knowledge/v1/stratum.proto";
import "legible/knowledge/v1/domain.proto";

// GenesisState defines the knowledge module's genesis state.
// Includes all persistent state: params, domains, facts, claims, references,
// stratum registry, and pending proposals.
message GenesisState {
  Params params = 1;
  repeated OntologicalDomain domains = 2;
  repeated Fact facts = 3;
  repeated Claim claims = 4;
  repeated FactReference fact_references = 5;
  StratumRegistry stratum_registry = 6;
  repeated DomainProposal pending_proposals = 7;
}
