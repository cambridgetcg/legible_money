syntax = "proto3";
package legible.schedule.v1;
option go_package = "github.com/legible-money/legible/x/schedule/types";

// TimeCondition triggers based on block height.
message TimeCondition {
  string type = 1;
  uint64 execute_at_block = 2;
  uint64 interval_blocks = 3;
  uint64 start_block = 4;
  uint64 end_block = 5;
}

// LogicCondition triggers based on state comparison.
message LogicCondition {
  string type = 1;
  string state_key = 2;
  string comparator = 3;
  string compare_value = 4;
  string direction = 5;
}

// CompoundCondition combines multiple conditions.
message CompoundCondition {
  string operator = 1;
  repeated ScheduleCondition conditions = 2;
}

// ScheduleCondition wraps the three condition types (exactly one must be set).
message ScheduleCondition {
  TimeCondition time_condition = 1;
  LogicCondition logic_condition = 2;
  CompoundCondition compound_condition = 3;
}

// ScheduleProcess represents a scheduled automation.
message ScheduleProcess {
  string id = 1;
  string creator = 2;
  ScheduleCondition condition = 3;
  string status = 4;
  uint64 execution_count = 5;
  uint64 max_executions = 6;
  string remaining_fee = 7;
  string fee_per_execution = 8;
  string target_address = 9;
  string call_data = 10;
  string transfer_value = 11;
  string linked_entity_type = 12;
  string linked_entity_id = 13;
  uint64 created_at_block = 14;
  uint64 expires_at_block = 15;
  uint64 next_execute_at = 16;
}

// Params holds module parameters.
message Params {
  uint32 max_active_per_account = 1;
  uint64 max_gas_per_block = 2;
  uint64 min_interval_blocks = 3;
  uint64 max_future_blocks = 4;
  uint64 min_prepaid_executions = 5;
  uint64 expired_retention_blocks = 6;
}
