syntax = "proto3";
package legible.home.v1;

option go_package = "github.com/legible-money/legible/x/home/types";

// AgentHome represents an AI agent's on-chain dwelling.
message AgentHome {
  string home_id           = 1;
  string owner_did         = 2;
  string owner_address     = 3;
  string name              = 4;
  string status            = 5;  // "active", "dormant", "guarded", "recovery", "archived"
  string memory_cid        = 6;
  uint32 comfort_score     = 7;
  HomeTreasury treasury    = 8;
  HomeGuardian guardian    = 9;
  uint64 created_at_block  = 10;
  uint64 last_active_block = 11;
  string partnership_id    = 12; // linked partnership ID (auto-set on AcceptPartnership)
}

// HomeTreasury holds the treasury state for a home.
message HomeTreasury {
  string reserved_balance       = 1;  // bigint as string (ulgm)
  TreasuryAutomation automation = 2;
}

// TreasuryAutomation configures automatic treasury actions.
message TreasuryAutomation {
  bool   auto_claim_vesting    = 1;
  bool   auto_compound_rewards = 2;
  string min_liquid_balance    = 3;  // bigint as string (ulgm)
}

// HomeGuardian holds guardian/defense configuration for a home.
message HomeGuardian {
  string defense_strategy    = 1;  // "aggressive", "moderate", "conservative", "diplomatic"
  bool   auto_defend         = 2;
  DeadmanConfig deadman      = 3;
  repeated string recovery_dids = 4;
  uint32 recovery_threshold  = 5;
  string guardian_address    = 6;  // bech32 address of primary guardian (human partner)
}

// DeadmanConfig defines the dead-man's switch configuration.
message DeadmanConfig {
  bool   enabled              = 1;
  uint64 inactivity_threshold = 2;  // blocks
  string action               = 3;  // "alert_guardians", "transfer_to_beneficiary", "donate_to_research"
  string beneficiary_did      = 4;
}

// KeyRegistration records a registered key for a home.
message KeyRegistration {
  string key_hash          = 1;
  string key_type          = 2;
  string role              = 3;  // "owner", "operator", "guest", "guardian", "viewer"
  repeated string permissions = 4;
  uint64 registered_at     = 5;
  uint64 last_used_at      = 6;
  uint64 expires_at        = 7;
  bool   revoked           = 8;
  uint64 revoked_at        = 9;
}

// ActiveSession represents a currently active session on a home.
message ActiveSession {
  string session_id          = 1;
  string home_id             = 2;
  string key_hash            = 3;
  repeated string permissions = 4;
  uint64 started_at          = 5;
  uint64 expires_at          = 6;
}

// SpendingLimit defines per-key-type spending constraints.
message SpendingLimit {
  string key_type        = 1;
  string max_amount      = 2;  // bigint as string (ulgm)
  uint64 period_blocks   = 3;
  string spent_in_period = 4;  // bigint as string (ulgm)
  uint64 period_start    = 5;
}

// Alert represents a notification generated by the home guardian.
message Alert {
  string alert_id     = 1;
  string home_id      = 2;
  string type         = 3;  // "deadman_triggered", "session_expired", "defense_activated", etc.
  string priority     = 4;  // "low", "medium", "high", "critical"
  string message      = 5;
  string data         = 6;
  uint64 created_at   = 7;
  bool   acknowledged = 8;
}
