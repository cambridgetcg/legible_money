syntax = "proto3";
package legible.evidence_mgmt.v1;

option go_package = "github.com/legible-money/legible/x/evidence_mgmt/types";

import "cosmos/msg/v1/msg.proto";
import "legible/evidence_mgmt/v1/genesis.proto";

// Msg defines the evidence management module's transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc SubmitEvidence(MsgSubmitEvidence) returns (MsgSubmitEvidenceResponse);
  rpc AuditEvidence(MsgAuditEvidence) returns (MsgAuditEvidenceResponse);
  rpc RegisterOracle(MsgRegisterOracle) returns (MsgRegisterOracleResponse);
  rpc SubmitOracleData(MsgSubmitOracleData) returns (MsgSubmitOracleDataResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// ============================================================================
// Messages
// ============================================================================

message MsgSubmitEvidence {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string claim_id = 2;
  string evidence_type = 3;
  string content_hash = 4;
  string description = 5;
  string source_uri = 6;
}

message MsgSubmitEvidenceResponse {
  string evidence_id = 1;
}

message MsgAuditEvidence {
  option (cosmos.msg.v1.signer) = "auditor";
  string auditor = 1;
  string evidence_id = 2;
  uint64 score = 3;
  string rationale = 4;
  string stake = 5;
}

message MsgAuditEvidenceResponse {
  string audit_id = 1;
}

message MsgRegisterOracle {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  string name = 2;
  string description = 3;
  repeated string data_types = 4;
  string stake = 5;
}

message MsgRegisterOracleResponse {
  string oracle_id = 1;
}

message MsgSubmitOracleData {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  string oracle_id = 2;
  string claim_id = 3;
  string content_hash = 4;
  string data_type = 5;
}

message MsgSubmitOracleDataResponse {
  string evidence_id = 1;
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2;
}

message MsgUpdateParamsResponse {}
