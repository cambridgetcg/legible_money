syntax = "proto3";
package legible.claiming_pot.v1;

option go_package = "github.com/legible-money/legible/x/claiming_pot/types";

// PotEligibility defines who can claim from a pot.
message PotEligibility {
  uint64 min_account_age               = 1;  // blocks (0 = no restriction)
  string min_activity_score            = 2;  // "0.0"-"1.0" (0 = no restriction)
  string max_balance                   = 3;  // bigint as string (ulgm, "" = no cap)
  uint32 required_verification_level   = 4;  // 0 = no restriction
  repeated string excluded_types       = 5;  // e.g. ["system","contract"]
  repeated string allowlist            = 6;  // if non-empty, ONLY these addresses can claim
}

// PotConfig is the immutable configuration for a claiming pot.
message PotConfig {
  string amount_per_claim        = 1;  // bigint as string (ulgm per claim)
  uint64 max_claims              = 2;  // 0 = unlimited
  uint64 max_claims_per_account  = 3;  // typically 1
  PotEligibility eligibility     = 4;
  uint64 expires_at_block        = 5;  // 0 = no expiration
  bool   creator_can_close       = 6;
}

// ClaimingPot represents the full pot state.
message ClaimingPot {
  string pot_id            = 1;
  string creator           = 2;  // bech32 address
  PotConfig config         = 3;
  string total_deposited   = 4;  // bigint as string (ulgm cumulative)
  string total_claimed     = 5;  // bigint as string (ulgm cumulative)
  string balance           = 6;  // bigint as string (ulgm current available)
  uint64 claim_count       = 7;
  uint64 created_at_block  = 8;
  uint64 closed_at_block   = 9;
  string status            = 10; // "active", "exhausted", "expired", "closed"
}

// ClaimRecord tracks per-account claims for a pot.
message ClaimRecord {
  string pot_id           = 1;
  string claimer          = 2;  // bech32 address
  uint64 claim_count      = 3;
  string total_amount     = 4;  // bigint as string (ulgm)
  uint64 last_claim_block = 5;
}
