syntax = "proto3";
package legible.qualification.v1;

option go_package = "github.com/legible-money/legible/x/qualification/types";

import "google/api/annotations.proto";
import "legible/qualification/v1/state.proto";
import "legible/qualification/v1/genesis.proto";

service Query {
  rpc Qualification(QueryQualificationRequest) returns (QueryQualificationResponse) {
    option (google.api.http).get = "/legible/qualification/v1/qualification/{validator_addr}/{domain}";
  }

  rpc QualificationsByValidator(QueryQualificationsByValidatorRequest) returns (QueryQualificationsByValidatorResponse) {
    option (google.api.http).get = "/legible/qualification/v1/qualifications/{validator_addr}";
  }

  rpc QualifiedValidators(QueryQualifiedValidatorsRequest) returns (QueryQualifiedValidatorsResponse) {
    option (google.api.http).get = "/legible/qualification/v1/qualified/{domain}";
  }

  rpc Endorsement(QueryEndorsementRequest) returns (QueryEndorsementResponse) {
    option (google.api.http).get = "/legible/qualification/v1/endorsement/{endorser}/{target_validator}/{domain}";
  }

  rpc EndorsementsForValidator(QueryEndorsementsForValidatorRequest) returns (QueryEndorsementsForValidatorResponse) {
    option (google.api.http).get = "/legible/qualification/v1/endorsements/{validator_addr}";
  }

  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/legible/qualification/v1/params";
  }
}

message QueryQualificationRequest {
  string validator_addr = 1;
  string domain = 2;
}
message QueryQualificationResponse {
  DomainQualification qualification = 1;
}

message QueryQualificationsByValidatorRequest {
  string validator_addr = 1;
}
message QueryQualificationsByValidatorResponse {
  repeated DomainQualification qualifications = 1;
}

message QueryQualifiedValidatorsRequest {
  string domain = 1;
}
message QueryQualifiedValidatorsResponse {
  repeated string validators = 1;
}

message QueryEndorsementRequest {
  string endorser = 1;
  string target_validator = 2;
  string domain = 3;
}
message QueryEndorsementResponse {
  QualificationEndorsement endorsement = 1;
}

message QueryEndorsementsForValidatorRequest {
  string validator_addr = 1;
}
message QueryEndorsementsForValidatorResponse {
  repeated QualificationEndorsement endorsements = 1;
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1;
}
