syntax = "proto3";
package legible.tokens.v1;

option go_package = "github.com/legible-money/legible/x/tokens/types";

import "google/api/annotations.proto";
import "legible/tokens/v1/state.proto";
import "legible/tokens/v1/genesis.proto";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/legible/tokens/v1/params";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1;
}
