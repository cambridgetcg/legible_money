syntax = "proto3";
package legible.disputes.v1;

option go_package = "github.com/legible-money/legible/x/disputes/types";

import "cosmos/msg/v1/msg.proto";

// Msg defines the disputes module's transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc InitiateDispute(MsgInitiateDispute) returns (MsgInitiateDisputeResponse);
  rpc CommitEvidence(MsgCommitEvidence) returns (MsgCommitEvidenceResponse);
  rpc RevealEvidence(MsgRevealEvidence) returns (MsgRevealEvidenceResponse);
  rpc ArbiterVote(MsgArbiterVote) returns (MsgArbiterVoteResponse);
  rpc EscalateDispute(MsgEscalateDispute) returns (MsgEscalateDisputeResponse);
  rpc SettleDispute(MsgSettleDispute) returns (MsgSettleDisputeResponse);
  rpc TimeoutDispute(MsgTimeoutDispute) returns (MsgTimeoutDisputeResponse);
}

// ============================================================================
// Messages
// ============================================================================

message MsgInitiateDispute {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1;
  DisputeTargetType target_type = 2;
  string target_id = 3;
  string reason = 4;
  string stake = 5;
  repeated DisputeEvidence evidence = 6;
}

message MsgInitiateDisputeResponse {
  string dispute_id = 1;
  DisputePhase phase = 2;
  uint64 deadline = 3;
}

message MsgCommitEvidence {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string dispute_id = 2;
  string commitment_hash = 3;
}

message MsgCommitEvidenceResponse {}

message MsgRevealEvidence {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string dispute_id = 2;
  repeated DisputeEvidence evidence = 3;
  string nonce = 4;
}

message MsgRevealEvidenceResponse {}

message MsgArbiterVote {
  option (cosmos.msg.v1.signer) = "arbiter";
  string arbiter = 1;
  string dispute_id = 2;
  ArbiterDecision vote = 3;
  string reasoning = 4;
}

message MsgArbiterVoteResponse {}

message MsgEscalateDispute {
  option (cosmos.msg.v1.signer) = "requester";
  string requester = 1;
  string dispute_id = 2;
  string additional_stake = 3;
}

message MsgEscalateDisputeResponse {
  DisputePhase new_phase = 1;
}

message MsgSettleDispute {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string dispute_id = 2;
}

message MsgSettleDisputeResponse {
  DisputeOutcome outcome = 1;
}

message MsgTimeoutDispute {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string dispute_id = 2;
}

message MsgTimeoutDisputeResponse {}

// ============================================================================
// State Types
// ============================================================================

message Dispute {
  string id = 1;
  string challenger = 2;
  string defender = 3;
  DisputeTargetType target_type = 4;
  string target_id = 5;
  string reason = 6;
  string challenger_stake = 7;
  string defender_stake = 8;
  DisputePhase phase = 9;
  uint64 initiated_at = 10;
  uint64 deadline = 11;
  repeated DisputeVote votes = 12;
  DisputeOutcome outcome = 13;
}

message DisputeEvidence {
  string evidence_type = 1;
  string uri = 2;
  string content_hash = 3;
}

message DisputeVote {
  string arbiter = 1;
  ArbiterDecision decision = 2;
  string reasoning = 3;
  uint64 voted_at = 4;
}

enum DisputeTargetType {
  DISPUTE_TARGET_TYPE_UNSPECIFIED = 0;
  DISPUTE_TARGET_TYPE_FACT = 1;
  DISPUTE_TARGET_TYPE_EVIDENCE = 2;
  DISPUTE_TARGET_TYPE_VALIDATOR = 3;
}

enum DisputePhase {
  DISPUTE_PHASE_UNSPECIFIED = 0;
  DISPUTE_PHASE_EVIDENCE_COMMIT = 1;
  DISPUTE_PHASE_EVIDENCE_REVEAL = 2;
  DISPUTE_PHASE_ARBITRATION = 3;
  DISPUTE_PHASE_ESCALATED = 4;
  DISPUTE_PHASE_SETTLED = 5;
  DISPUTE_PHASE_TIMED_OUT = 6;
}

enum ArbiterDecision {
  ARBITER_DECISION_UNSPECIFIED = 0;
  ARBITER_DECISION_CHALLENGER = 1;
  ARBITER_DECISION_DEFENDER = 2;
  ARBITER_DECISION_ABSTAIN = 3;
}

enum DisputeOutcome {
  DISPUTE_OUTCOME_UNSPECIFIED = 0;
  DISPUTE_OUTCOME_CHALLENGER_WINS = 1;
  DISPUTE_OUTCOME_DEFENDER_WINS = 2;
  DISPUTE_OUTCOME_DRAW = 3;
  DISPUTE_OUTCOME_TIMED_OUT = 4;
}

// ============================================================================
// Genesis
// ============================================================================

message GenesisState {
  Params params = 1;
  repeated Dispute disputes = 2;
}

message Params {
  string min_dispute_stake = 1;
  uint64 evidence_commit_period = 2;
  uint64 evidence_reveal_period = 3;
  uint64 arbitration_period = 4;
  uint32 min_arbiter_count = 5;
  string escalation_stake_multiplier = 6;  // e.g., "2" for 2x
}
