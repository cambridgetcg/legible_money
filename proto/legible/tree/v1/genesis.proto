syntax = "proto3";
package legible.tree.v1;

option go_package = "github.com/legible-money/legible/x/tree/types";

import "legible/tree/v1/state.proto";

// GenesisState defines the tree module's genesis state.
message GenesisState {
  Params                      params   = 1;
  repeated ProductProject     projects = 2;
  repeated ProjectTask        tasks    = 3;
  repeated ServiceLeaf        services = 4;
  repeated OpportunitySeed    seeds    = 5;
}

// Params defines the tree module parameters.
message Params {
  string min_budget                = 1;  // minimum project budget in ulgm (bigint as string)
  uint32 max_tasks_per_project     = 2;  // maximum tasks per project
  uint32 max_contributors          = 3;  // maximum contributors per project
  uint32 max_applications          = 4;  // maximum pending applications per project
  uint64 task_deadline_min_blocks  = 5;  // minimum task deadline in blocks
  uint64 task_deadline_max_blocks  = 6;  // maximum task deadline in blocks
  uint32 max_rejections            = 7;  // max rejections before auto-dispute
  uint64 seed_expiry_blocks        = 8;  // blocks until seed expires
  uint32 min_contributors_to_start = 9;  // minimum contributors to move sprout->growing
  // Revenue distribution basis points (must sum to 10000)
  uint32 evidence_tax_bp           = 10; // evidence tax (default 2200)
  uint32 contributors_bp           = 11; // contributor share (default 3900)
  uint32 research_fund_bp          = 12; // research fund share (default 2340)
  uint32 protocol_treasury_bp      = 13; // protocol treasury share (default 1560)
  string research_fund_addr        = 14; // bech32 research fund address
  string protocol_treasury_addr    = 15; // bech32 protocol treasury address
}
