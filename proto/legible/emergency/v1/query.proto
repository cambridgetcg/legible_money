syntax = "proto3";
package legible.emergency.v1;
option go_package = "github.com/legible-money/legible/x/emergency/types";
import "google/api/annotations.proto";
import "legible/emergency/v1/state.proto";
import "legible/emergency/v1/genesis.proto";
service Query {
  rpc Status(QueryStatusRequest) returns (QueryStatusResponse) { option (google.api.http).get = "/legible/emergency/v1/status"; }
  rpc ActiveCeremony(QueryActiveCeremonyRequest) returns (QueryActiveCeremonyResponse) { option (google.api.http).get = "/legible/emergency/v1/ceremony/active"; }
  rpc CompletedCeremonies(QueryCompletedCeremoniesRequest) returns (QueryCompletedCeremoniesResponse) { option (google.api.http).get = "/legible/emergency/v1/ceremonies/completed"; }
  rpc AuditLog(QueryAuditLogRequest) returns (QueryAuditLogResponse) { option (google.api.http).get = "/legible/emergency/v1/audit_log"; }
}
message QueryStatusRequest {}
message QueryStatusResponse { string status = 1; bool is_halted = 2; string active_halt_ceremony_id = 3; }
message QueryActiveCeremonyRequest {}
message QueryActiveCeremonyResponse { EmergencyCeremony ceremony = 1; bool found = 2; }
message QueryCompletedCeremoniesRequest { uint32 limit = 1; uint32 offset = 2; }
message QueryCompletedCeremoniesResponse { repeated EmergencyCeremony ceremonies = 1; uint64 total = 2; }
message QueryAuditLogRequest { uint32 limit = 1; uint32 offset = 2; }
message QueryAuditLogResponse { repeated EmergencyAuditEntry entries = 1; uint64 total = 2; }
