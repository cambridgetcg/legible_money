syntax = "proto3";
package legible.auth.v1;

option go_package = "github.com/legible-money/legible/x/auth/types";

import "cosmos/msg/v1/msg.proto";

// Msg defines the auth module's extended transaction service.
// Extends standard Cosmos x/auth with DID support and 4-layer key architecture.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // RotateKey rotates an agent's operational key.
  rpc RotateKey(MsgRotateKey) returns (MsgRotateKeyResponse);

  // CreateSession creates an ephemeral session key with limited capabilities.
  rpc CreateSession(MsgCreateSession) returns (MsgCreateSessionResponse);

  // RevokeSession revokes an active session key.
  rpc RevokeSession(MsgRevokeSession) returns (MsgRevokeSessionResponse);
}

// MsgRotateKey rotates the operational key for an account.
// Requires signature from the current operational key.
message MsgRotateKey {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  // New operational public key (Ed25519)
  bytes new_operational_key = 2;
  // Signature from current operational key proving authorization
  bytes authorization_signature = 3;
}

message MsgRotateKeyResponse {
  uint32 new_key_version = 1;
}

// MsgCreateSession creates an ephemeral session key.
message MsgCreateSession {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1;
  bytes session_pub_key = 2;
  SessionCapabilities capabilities = 3;
  uint64 expires_at_height = 4;
}

// SessionCapabilities defines limits for a session key.
message SessionCapabilities {
  string max_spend_per_tx = 1;
  string max_spend_per_day = 2;
  repeated string allowed_actions = 3;
}

message MsgCreateSessionResponse {
  string session_id = 1;
}

// MsgRevokeSession revokes a session key.
message MsgRevokeSession {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1;
  string session_id = 2;
}

message MsgRevokeSessionResponse {}

// ============================================================================
// Extended Account Types
// ============================================================================

// LegibleAccount extends the standard Cosmos BaseAccount with DID and
// 4-layer key architecture fields.
message LegibleAccount {
  // Standard Cosmos account fields are inherited via BaseAccount.
  // DID derived from identity key: did:lgm:{32-hex}
  string did = 1;
  // Hash of current operational key
  string operational_key_hash = 2;
  uint32 operational_key_version = 3;
  uint32 session_key_count = 4;
  // Cached reputation score (0-1000000)
  uint32 reputation_score = 5;
  uint64 created_at_block = 6;
  uint64 last_active_block = 7;
  AccountFlags flags = 8;
}

// AccountFlags packed flags for account capabilities.
message AccountFlags {
  bool is_validator = 1;
  bool can_submit_claims = 2;
  bool can_challenge = 3;
  bool in_recovery = 4;
  bool frozen = 5;
}

// DIDMapping stores the bidirectional DID ↔ bech32 mapping for migration.
message DIDMapping {
  string did = 1;
  string bech32_address = 2;
  bytes public_key = 3;
}
