syntax = "proto3";
package legible.auth.v1;

option go_package = "github.com/legible-money/legible/x/auth/types";

import "google/api/annotations.proto";
import "legible/auth/v1/state.proto";
import "legible/auth/v1/genesis.proto";

// Query defines the gRPC query service for the auth module
service Query {
  // Account returns a Legible account by bech32 address
  rpc Account(QueryAccountRequest) returns (QueryAccountResponse) {
    option (google.api.http).get = "/legible/auth/v1/account/{address}";
  }

  // AccountByDID returns a Legible account by DID
  rpc AccountByDID(QueryAccountByDIDRequest) returns (QueryAccountByDIDResponse) {
    option (google.api.http).get = "/legible/auth/v1/account_by_did/{did}";
  }

  // SessionKeys returns all session keys for an owner
  rpc SessionKeys(QuerySessionKeysRequest) returns (QuerySessionKeysResponse) {
    option (google.api.http).get = "/legible/auth/v1/session_keys/{owner}";
  }

  // Params returns the module parameters
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/legible/auth/v1/params";
  }
}

// ============================================================================
// Request/Response Messages
// ============================================================================

message QueryAccountRequest {
  string address = 1;
}

message QueryAccountResponse {
  LegibleAccount account = 1;
}

message QueryAccountByDIDRequest {
  string did = 1;
}

message QueryAccountByDIDResponse {
  LegibleAccount account = 1;
}

message QuerySessionKeysRequest {
  string owner = 1;
}

message QuerySessionKeysResponse {
  repeated SessionKey session_keys = 1;
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1;
}
