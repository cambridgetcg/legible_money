syntax = "proto3";
package legible.channels.v1;

option go_package = "github.com/legible-money/legible/x/channels/types";

import "cosmos/msg/v1/msg.proto";

// Msg defines the payment channels module's transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc OpenChannel(MsgOpenChannel) returns (MsgOpenChannelResponse);
  rpc UpdateChannel(MsgUpdateChannel) returns (MsgUpdateChannelResponse);
  rpc CloseChannel(MsgCloseChannel) returns (MsgCloseChannelResponse);
  rpc SettleChannel(MsgSettleChannel) returns (MsgSettleChannelResponse);
  rpc DisputeChannel(MsgDisputeChannel) returns (MsgDisputeChannelResponse);
}

// ============================================================================
// Messages
// ============================================================================

message MsgOpenChannel {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string receiver = 2;
  string deposit = 3;
  uint64 timeout_height = 4;
}

message MsgOpenChannelResponse {
  string channel_id = 1;
}

message MsgUpdateChannel {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string channel_id = 2;
  string new_balance_sender = 3;
  string new_balance_receiver = 4;
  uint64 sequence = 5;
  bytes signature = 6;
}

message MsgUpdateChannelResponse {}

message MsgCloseChannel {
  option (cosmos.msg.v1.signer) = "closer";
  string closer = 1;
  string channel_id = 2;
  string final_balance_sender = 3;
  string final_balance_receiver = 4;
  uint64 sequence = 5;
  bytes counterparty_signature = 6;
}

message MsgCloseChannelResponse {}

message MsgSettleChannel {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string channel_id = 2;
}

message MsgSettleChannelResponse {
  string amount_to_sender = 1;
  string amount_to_receiver = 2;
}

message MsgDisputeChannel {
  option (cosmos.msg.v1.signer) = "disputer";
  string disputer = 1;
  string channel_id = 2;
  string claimed_balance_sender = 3;
  string claimed_balance_receiver = 4;
  uint64 sequence = 5;
  bytes proof_signature = 6;
}

message MsgDisputeChannelResponse {}

// ChannelStatus enum used by transaction processing.
enum ChannelStatus {
  CHANNEL_STATUS_UNSPECIFIED = 0;
  CHANNEL_STATUS_OPEN = 1;
  CHANNEL_STATUS_CLOSING = 2;
  CHANNEL_STATUS_DISPUTED = 3;
  CHANNEL_STATUS_SETTLED = 4;
}
