version: v1
plugins:
  - plugin: buf.build/protocolbuffers/go
    out: ..
    opt:
      - module=github.com/legible-money/legible
  - plugin: buf.build/grpc/go
    out: ..
    opt:
      - module=github.com/legible-money/legible
  - name: grpc-gateway
    out: ..
    opt:
      - module=github.com/legible-money/legible
      - logtostderr=true
    path: /Users/yu/go/bin/protoc-gen-grpc-gateway
