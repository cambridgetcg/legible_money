name: Bug Report
description: Report a bug in the Legible Money protocol
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce this bug?
      placeholder: |
        1. Run `go test ./x/knowledge/...`
        2. See error in ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - low - cosmetic or minor
        - medium - incorrect behavior
        - high - data loss or security
        - critical - consensus or funds at risk
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Affected Module
      description: Which module is affected?
      placeholder: "e.g., x/knowledge, x/staking, consensus/pot"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Go version, OS, logs, screenshots, etc.
    validations:
      required: false
