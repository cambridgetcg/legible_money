name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2E Cosmos devnet tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'

jobs:
  build:
    name: "Go: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
      - run: go build ./...

  test:
    name: "Go: Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
      - run: go test ./x/... -count=1 -v
      - run: go test ./app/... -count=1 -v

  lint:
    name: "Go: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: --timeout=10m

  # === E2E: Cosmos DevNet (manual trigger only) ===

  e2e-cosmos:
    name: "E2E: Cosmos DevNet"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Build legbled binary
        run: |
          mkdir -p build
          go build -o build/legbled ./cmd/legbled

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Start devnet (background)
        run: |
          bash devnet/scripts/cosmos-devnet.sh start &
          DEVNET_PID=$!
          echo "DEVNET_PID=$DEVNET_PID" >> $GITHUB_ENV
          echo "Waiting for devnet to start..."
          for i in $(seq 1 30); do
            HEIGHT=$(curl -s http://localhost:26657/status 2>/dev/null | jq -r '.result.sync_info.latest_block_height // "0"' 2>/dev/null || echo "0")
            if [ "$HEIGHT" -gt 1 ] 2>/dev/null; then
              echo "DevNet ready at height $HEIGHT"
              break
            fi
            sleep 3
          done

      - name: Run tx lifecycle tests
        run: bash devnet/scripts/test-tx-lifecycle.sh

      - name: Stop devnet
        if: always()
        run: bash devnet/scripts/cosmos-devnet.sh stop || true

  # === Test Monotonicity Check ===

  test-monotonicity:
    name: "Test Count Monotonicity"
    if: github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Count tests on PR branch
        id: pr-tests
        run: |
          COUNT=$(go test ./x/... -count=1 -v 2>&1 | grep -c '^--- PASS' || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "PR branch test count: $COUNT"

      - name: Count tests on main
        id: main-tests
        run: |
          git stash || true
          git checkout origin/main -- . 2>/dev/null || true
          COUNT=$(go test ./x/... -count=1 -v 2>&1 | grep -c '^--- PASS' || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Main branch test count: $COUNT"
          git checkout - -- . 2>/dev/null || true
          git stash pop 2>/dev/null || true

      - name: Check monotonicity
        run: |
          PR=${{ steps.pr-tests.outputs.count }}
          MAIN=${{ steps.main-tests.outputs.count }}
          echo "Tests: main=$MAIN → PR=$PR"
          if [ "$PR" -lt "$MAIN" ]; then
            echo "::error::Test count decreased: $MAIN → $PR. PRs must not remove tests without replacement."
            exit 1
          fi
          echo "Test count maintained or increased."

  # === Agent Contribution Checks (conditional) ===

  agent-validate:
    name: "Agent: Validate Contribution"
    if: contains(github.event.pull_request.labels.*.name, 'agent-contribution')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          CHANGED=$(git diff --stat origin/main...HEAD -- ':(exclude)*_test.go' ':(exclude)*.md' | tail -1)
          echo "Changed: $CHANGED"
          INSERTIONS=$(echo "$CHANGED" | grep -oP '\d+ insertion' | grep -oP '\d+' || echo "0")
          DELETIONS=$(echo "$CHANGED" | grep -oP '\d+ deletion' | grep -oP '\d+' || echo "0")
          LOC=$((INSERTIONS + DELETIONS))
          echo "Non-test LOC changed: $LOC"
          if [ "$LOC" -gt 500 ]; then
            echo "::warning::PR exceeds 500 LOC guideline ($LOC LOC). Consider splitting."
          fi

      - name: Check for binary files
        run: |
          BINARIES=$(git diff --name-only origin/main...HEAD | xargs file 2>/dev/null | grep -v text | grep -v empty || true)
          if [ -n "$BINARIES" ]; then
            echo "::error::Binary files detected in PR:"
            echo "$BINARIES"
            exit 1
          fi

      - name: Check for secret patterns
        run: |
          SECRETS=$(git diff origin/main...HEAD -- . ':(exclude)*.md' ':(exclude)*_test.go' | grep -iP '(password|secret|api_key|private_key|token)\s*[:=]' || true)
          if [ -n "$SECRETS" ]; then
            echo "::error::Potential secrets detected in diff:"
            echo "$SECRETS" | head -10
            exit 1
          fi

      - name: Verify conventional commit
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qP '^(feat|fix|docs|test|refactor|chore|ci)\('; then
            echo "::warning::PR title '$TITLE' doesn't follow conventional commit format: type(scope): description"
          fi

  # === Governance Check (proposal PRs only) ===

  governance-check:
    name: "Governance: Proposal Validation"
    if: contains(toJSON(github.event.pull_request.labels), 'proposal')
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate proposal PR
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const errors = [];

            if (!/##.*Three Laws/i.test(body)) {
              errors.push('Missing "Three Laws" section');
            }
            if (!/##.*Security/i.test(body)) {
              errors.push('Missing "Security" section');
            }

            if (errors.length > 0) {
              core.setFailed(`Proposal validation: ${errors.join('; ')}`);
            } else {
              console.log('Proposal structure validated');
            }

  # === Metrics Collection ===

  collect-metrics:
    name: "Collect CI Metrics"
    if: always()
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Aggregate results
        run: |
          cat <<EOF > ci-metrics.json
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "pr": "${{ github.event.pull_request.number }}",
            "author": "${{ github.event.pull_request.user.login }}",
            "jobs": {
              "build": "${{ needs.build.result }}",
              "test": "${{ needs.test.result }}",
              "lint": "${{ needs.lint.result }}"
            },
            "all_passed": ${{ needs.build.result == 'success' && needs.test.result == 'success' && needs.lint.result == 'success' }}
          }
          EOF
          cat ci-metrics.json

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-metrics-${{ github.run_id }}
          path: ci-metrics.json
          retention-days: 90
