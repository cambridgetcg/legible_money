version: 2

updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "legible-money/core"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps(go):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "legible-money/core"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions):"

  # npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "legible-money/core"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(npm):"
