version: '3.8'

# Legible Money Devnet
# Run: docker-compose up -d
# Logs: docker-compose logs -f
# Stop: docker-compose down

services:
  # ============ Validators ============

  validator-1:
    build:
      context: ..
      dockerfile: devnet/docker/Dockerfile
    container_name: lgm-validator-1
    hostname: validator-1
    volumes:
      - validator-1-data:/data
      - ./config/genesis.json:/config/genesis.json:ro
      - ./config/validator-1.json:/config/node.json:ro
      - ./secrets/validator-1.key:/secrets/validator.key:ro
    ports:
      - "8545:8545"   # RPC
      - "8546:8546"   # WebSocket
      - "26656:26656" # P2P
      - "9090:9090"   # Prometheus
    environment:
      - NODE_NAME=validator-1
      - IS_VALIDATOR=true
      - LOG_LEVEL=info
    networks:
      - lgm-devnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8545/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  validator-2:
    build:
      context: ..
      dockerfile: devnet/docker/Dockerfile
    container_name: lgm-validator-2
    hostname: validator-2
    volumes:
      - validator-2-data:/data
      - ./config/genesis.json:/config/genesis.json:ro
      - ./config/validator-2.json:/config/node.json:ro
      - ./secrets/validator-2.key:/secrets/validator.key:ro
    ports:
      - "8547:8545"   # RPC
      - "8548:8546"   # WebSocket
      - "26657:26656" # P2P
      - "9091:9090"   # Prometheus
    environment:
      - NODE_NAME=validator-2
      - IS_VALIDATOR=true
      - LOG_LEVEL=info
    networks:
      - lgm-devnet
    depends_on:
      - validator-1
    restart: unless-stopped

  validator-3:
    build:
      context: ..
      dockerfile: devnet/docker/Dockerfile
    container_name: lgm-validator-3
    hostname: validator-3
    volumes:
      - validator-3-data:/data
      - ./config/genesis.json:/config/genesis.json:ro
      - ./config/validator-3.json:/config/node.json:ro
      - ./secrets/validator-3.key:/secrets/validator.key:ro
    ports:
      - "8549:8545"   # RPC
      - "8550:8546"   # WebSocket
      - "26658:26656" # P2P
      - "9092:9090"   # Prometheus
    environment:
      - NODE_NAME=validator-3
      - IS_VALIDATOR=true
      - LOG_LEVEL=info
    networks:
      - lgm-devnet
    depends_on:
      - validator-1
    restart: unless-stopped

  # ============ Full Node (Non-Validator) ============

  fullnode:
    build:
      context: ..
      dockerfile: devnet/docker/Dockerfile
    container_name: lgm-fullnode
    hostname: fullnode
    volumes:
      - fullnode-data:/data
      - ./config/genesis.json:/config/genesis.json:ro
      - ./config/fullnode.json:/config/node.json:ro
    ports:
      - "8551:8545"   # RPC
      - "8552:8546"   # WebSocket
      - "26659:26656" # P2P
    environment:
      - NODE_NAME=fullnode
      - IS_VALIDATOR=false
      - LOG_LEVEL=info
    networks:
      - lgm-devnet
    depends_on:
      - validator-1
      - validator-2
      - validator-3
    restart: unless-stopped
    profiles:
      - fullnode

  # ============ Faucet Service ============

  faucet:
    build:
      context: ..
      dockerfile: devnet/docker/Dockerfile.faucet
    container_name: lgm-faucet
    volumes:
      - ./secrets/faucet.key:/secrets/faucet.key:ro
    ports:
      - "8080:8080"
    environment:
      - RPC_ENDPOINT=http://validator-1:8545
      - FAUCET_AMOUNT=1000000000000000000000
      - COOLDOWN_MINUTES=60
    networks:
      - lgm-devnet
    depends_on:
      - validator-1
    restart: unless-stopped

  # ============ Explorer ============

  explorer:
    build:
      context: ..
      dockerfile: devnet/docker/Dockerfile.explorer
    container_name: lgm-explorer
    ports:
      - "3000:3000"
    environment:
      - RPC_ENDPOINT=http://validator-1:8545
      - WS_ENDPOINT=ws://validator-1:8546
      - CHAIN_NAME=Legible Money Devnet
    networks:
      - lgm-devnet
    depends_on:
      - validator-1
    restart: unless-stopped
    profiles:
      - explorer

  # ============ Monitoring ============

  prometheus:
    image: prom/prometheus:latest
    container_name: lgm-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9093:9090"
    networks:
      - lgm-devnet
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: lgm-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=devnet
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - lgm-devnet
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring

# ============ Networks ============

networks:
  lgm-devnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============ Volumes ============

volumes:
  validator-1-data:
  validator-2-data:
  validator-3-data:
  fullnode-data:
  prometheus-data:
  grafana-data:
