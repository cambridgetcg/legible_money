# Legible Money — 3-Validator Cosmos SDK DevNet
#
# Usage:
#   # 1. Build the image
#   docker build -f deployment/docker/Dockerfile.cosmos -t legbled .
#
#   # 2. Initialize the devnet (generates genesis, keys, configs)
#   ./deployment/docker/init-cosmos-docker.sh
#
#   # 3. Start the network
#   docker compose -f deployment/docker/docker-compose.cosmos.yml up -d
#
#   # 4. Check status
#   curl -s localhost:26657/status | jq .result.sync_info.latest_block_height
#
#   # 5. Tear down (keep volumes)
#   docker compose -f deployment/docker/docker-compose.cosmos.yml down
#
#   # 6. Tear down (destroy volumes)
#   docker compose -f deployment/docker/docker-compose.cosmos.yml down -v
#
# Profiles:
#   --profile explorer    — Ping.pub block explorer on :8080
#   --profile faucet      — LGM faucet on :8088
#   --profile monitoring  — Prometheus (:9093) + Grafana (:3000)

name: lgm-devnet

services:
  # ──── Validator 1 (Seed + Primary) ────
  validator-1:
    image: legbled:latest
    container_name: lgm-validator-1
    environment:
      MONIKER: validator-1
      CHAIN_ID: lgm-devnet-1
      MINIMUM_GAS: "0.025ulgm"
      UNSAFE_CORS: "true"
      ENABLE_API: "true"
      ENABLE_GRPC: "true"
      PRUNING: default
    ports:
      - "26656:26656"   # P2P
      - "26657:26657"   # RPC
      - "1317:1317"     # REST API
      - "9090:9090"     # gRPC
      - "26660:26660"   # Prometheus metrics
    volumes:
      - validator-1-data:/root/.legbled
    networks:
      - lgm-net
    stop_grace_period: 30s
    restart: unless-stopped

  # ──── Validator 2 ────
  validator-2:
    image: legbled:latest
    container_name: lgm-validator-2
    environment:
      MONIKER: validator-2
      CHAIN_ID: lgm-devnet-1
      MINIMUM_GAS: "0.025ulgm"
      UNSAFE_CORS: "true"
      ENABLE_API: "true"
      ENABLE_GRPC: "true"
      PRUNING: default
    ports:
      - "26666:26656"   # P2P
      - "26667:26657"   # RPC
      - "1318:1317"     # REST API
      - "9091:9090"     # gRPC
      - "26661:26660"   # Prometheus metrics
    volumes:
      - validator-2-data:/root/.legbled
    networks:
      - lgm-net
    stop_grace_period: 30s
    restart: unless-stopped

  # ──── Validator 3 ────
  validator-3:
    image: legbled:latest
    container_name: lgm-validator-3
    environment:
      MONIKER: validator-3
      CHAIN_ID: lgm-devnet-1
      MINIMUM_GAS: "0.025ulgm"
      UNSAFE_CORS: "true"
      ENABLE_API: "true"
      ENABLE_GRPC: "true"
      PRUNING: default
    ports:
      - "26676:26656"   # P2P
      - "26677:26657"   # RPC
      - "1319:1317"     # REST API
      - "9092:9090"     # gRPC
      - "26662:26660"   # Prometheus metrics
    volumes:
      - validator-3-data:/root/.legbled
    networks:
      - lgm-net
    stop_grace_period: 30s
    restart: unless-stopped

  # ──── Block Explorer (Ping.pub) ────
  explorer:
    image: ghcr.io/ping-pub/explorer:latest
    container_name: lgm-explorer
    ports:
      - "8080:80"
    volumes:
      - ./ping-pub-config:/app/chains/mainnet:ro
    networks:
      - lgm-net
    depends_on:
      - validator-1
    profiles:
      - explorer

  # ──── Faucet ────
  faucet:
    build:
      context: ../..
      dockerfile: tools/faucet/Dockerfile
    image: lgm-faucet:latest
    container_name: lgm-faucet
    environment:
      CHAIN_ID: lgm-devnet-1
      NODE_URL: "http://lgm-validator-1:26657"
      KEYRING_DIR: /root/.legbled
      FAUCET_KEY_NAME: faucet
      FAUCET_AMOUNT: "10000000ulgm"
      LISTEN_ADDR: ":8088"
    ports:
      - "8088:8088"
    volumes:
      - validator-1-data:/root/.legbled:ro
    networks:
      - lgm-net
    depends_on:
      - validator-1
    profiles:
      - faucet
    restart: unless-stopped

  # ──── Prometheus ────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: lgm-prometheus
    ports:
      - "9093:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - lgm-net
    depends_on:
      - validator-1
    profiles:
      - monitoring
    restart: unless-stopped

  # ──── Grafana ────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: lgm-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lgmdevnet
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - lgm-net
    depends_on:
      - prometheus
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  validator-1-data:
  validator-2-data:
  validator-3-data:
  prometheus-data:
  grafana-data:

networks:
  lgm-net:
    driver: bridge
