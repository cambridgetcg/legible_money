# Prometheus configuration for Legible Money devnet.
# Scrapes CometBFT metrics from all 3 validators.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cometbft"
    static_configs:
      - targets:
          - "lgm-validator-1:26660"
          - "lgm-validator-2:26660"
          - "lgm-validator-3:26660"
        labels:
          chain: "lgm-devnet-1"

  - job_name: "cosmos-sdk"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "lgm-validator-1:26660"
          - "lgm-validator-2:26660"
          - "lgm-validator-3:26660"
        labels:
          chain: "lgm-devnet-1"
